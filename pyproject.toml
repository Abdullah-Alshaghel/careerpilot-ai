# Workspace-level Python tooling only. Each service/library has its own
# pyproject.toml with its own dependencies.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["node_modules", ".venv", "apps", "packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"tests/**" = ["S101", "S105", "S106"]
"**/migrations/**" = ["E501"]
# CV parsing must match typographic dashes and bullets that real CVs contain.
"services/career-profile-service/src/career_profile_service/parser.py" = ["RUF001"]
"services/career-profile-service/tests/**" = ["S101", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["careerpilot_common", "api_gateway", "identity_service", "document_service", "career_profile_service", "company_service", "job_discovery_service", "tests"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
# Lets integration tests share helpers (tests/integration/conftest.py).
pythonpath = ["."]
testpaths = ["shared/python/tests", "services", "tests/contract", "tests/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires the docker compose stack (CAREERPILOT_INTEGRATION=1)",
]
