# Local development broker configuration.
# Topology (careerpilot.events topic exchange, per-consumer queues with
# dead-letter exchange careerpilot.dlx) is declared idempotently by producers
# and consumers at startup — see docs/EVENTS.md. Introduced in Phase 5.
loopback_users.guest = true
log.console = true
log.console.level = warning
management.tcp.port = 15672
# Messages are persistent; give the broker room before blocking publishers.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB
