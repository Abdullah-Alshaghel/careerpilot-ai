[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot-common"
version = "0.1.0"
description = "Cross-cutting infrastructure for CareerPilot services: config, logging, correlation IDs, health, errors, event envelopes. Contains NO domain models."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.162.5",
    "pydantic==2.14.3",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]==2.0.58", "psycopg[binary]==3.3.9"]
redis = ["redis==8.1.0"]
rabbitmq = ["aio-pika==9.6.2"]
telemetry = [
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
]

[tool.setuptools.packages.find]
where = ["src"]
