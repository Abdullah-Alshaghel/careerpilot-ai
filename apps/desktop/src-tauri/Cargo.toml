[package]
name = "careerpilot-desktop"
version = "0.1.0"
description = "CareerPilot AI desktop client"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# OS credential store for the session refresh token (Windows Credential
# Manager, macOS Keychain). Linux is not a supported desktop target.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
# Opens company careers pages in the system browser (scoped to https:// only).
tauri-plugin-opener = "=2.7.2"

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
