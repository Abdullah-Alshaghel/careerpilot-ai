[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot-career-profile-service"
version = "0.1.0"
description = "Career profile: career facts with source, evidence, confidence and verification status. Owns the `career_profile` database."
requires-python = ">=3.10"
dependencies = [
    "careerpilot-common[postgres,rabbitmq,telemetry,auth]",
    "alembic==1.20.1",
    "uvicorn[standard]==0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]
