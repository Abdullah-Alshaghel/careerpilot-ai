[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot-identity-service"
version = "0.1.0"
description = "Identity: users, sessions, roles, devices. Owns the `identity` database."
requires-python = ">=3.10"
dependencies = [
    "careerpilot-common[postgres,rabbitmq,telemetry]",
    "alembic==1.20.1",
    "uvicorn[standard]==0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]
