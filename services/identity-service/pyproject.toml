[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot-identity-service"
version = "0.1.0"
description = "Identity: users, sessions, authentication. Owns the `identity` database and the token signing key."
requires-python = ">=3.10"
dependencies = [
    "careerpilot-common[postgres,rabbitmq,telemetry,auth]",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "email-validator==2.4.0",
    "uvicorn[standard]==0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]
