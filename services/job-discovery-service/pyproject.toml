[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot-job-discovery-service"
version = "0.1.0"
description = "Job discovery: user-started search runs over permitted public job sources, normalization, deduplication. Owns the `jobs` database."
requires-python = ">=3.10"
dependencies = [
    "careerpilot-common[postgres,rabbitmq,telemetry,auth]",
    "alembic==1.20.1",
    "uvicorn[standard]==0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]
