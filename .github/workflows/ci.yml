name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, unit, contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check shared services tests scripts
      - run: pytest

  frontend:
    name: Frontend (lint, typecheck, unit, web build, secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm run build -w @careerpilot/desktop
      - run: npm run check:secrets

  integration-e2e:
    name: Integration + Web E2E (docker compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Generate throwaway CI secrets
        run: python scripts/init-env.py
      - run: docker compose up -d --build --wait
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/integration
        env:
          CAREERPILOT_INTEGRATION: "1"
      - run: npm ci
      - run: npx -w @careerpilot/e2e playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run test:e2e
        env:
          E2E_LIVE: "1"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Desktop security-boundary tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      # Unsigned development-channel bundles. Signed release builds run from a
      # separate, manually approved workflow once signing credentials exist
      # (see docs/DESKTOP_RELEASE.md).
      - name: Build unsigned bundle
        run: npm run tauri -w @careerpilot/desktop -- build ${{ matrix.os == 'windows-latest' && '--bundles nsis' || '--bundles app' }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-unsigned-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
          retention-days: 7
